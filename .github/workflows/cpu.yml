name: CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dependencies
        run: python -m pip install 'numpy==2.2.6' 'pytest>=8,<10'
      - name: CPU-only trainer dependency
        run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Bounded native, grid, serial, launcher and trainer verification
        run: python -B scripts/verify_duck_cpu.py --output "$RUNNER_TEMP/duck-cpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duck-cpu-evidence
          path: ${{ runner.temp }}/duck-cpu
          if-no-files-found: ignore
